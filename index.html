<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>תזרים משפחתי</title>
  
  <!-- PWA & Mobile App Settings -->
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="תזרים משפחתי" />
  <meta name="theme-color" content="#4f46e5" />
  <link rel="apple-touch-icon" href="https://cdn-icons-png.flaticon.com/512/2845/2845831.png" />

  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Lucide Icons -->
  <script src="https://unpkg.com/lucide@latest"></script>
  <!-- Chart.js -->
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

  <style>
    @import url('https://fonts.googleapis.com/css2?family=Rubik:ital,wght@0,300..900;1,300..900&display=swap');
    body { font-family: 'Rubik', sans-serif; -webkit-tap-highlight-color: transparent; }
    
    /* Glassmorphism Effect */
    .glass-card {
      background: linear-gradient(135deg, rgba(79, 70, 229, 0.95) 0%, rgba(99, 102, 241, 0.85) 50%, rgba(124, 58, 237, 0.95) 100%);
      backdrop-filter: blur(16px);
      box-shadow: 0 12px 32px -8px rgba(79, 70, 229, 0.4);
    }
    
    /* Smooth Transitions for Modal */
    .modal-sheet {
      transition: transform 0.3s cubic-bezier(0.16, 1, 0.3, 1);
    }
    .modal-sheet.closed {
      transform: translateY(100%);
    }

    ::-webkit-scrollbar { width: 0px; }
  </style>
</head>
<body class="bg-slate-100 text-slate-800 min-h-screen pb-24 select-none">

  <!-- App Header -->
  <header class="bg-white/80 backdrop-blur-md sticky top-0 z-30 border-b border-slate-200/60">
    <div class="max-w-md mx-auto px-4 py-3 flex items-center justify-between">
      <div class="flex items-center gap-2.5">
        <div class="w-9 h-9 bg-indigo-600 rounded-xl flex items-center justify-center text-white shadow-md shadow-indigo-200">
          <i data-lucide="wallet" class="w-5 h-5"></i>
        </div>
        <div>
          <h1 class="text-sm font-bold text-slate-900 leading-tight">תזרים משפחתי</h1>
          <p class="text-[11px] text-slate-400 font-medium">ניהול תקציב חכם</p>
        </div>
      </div>
      
      <button onclick="fetchData()" id="syncBtn" class="flex items-center gap-1.5 px-3 py-1.5 rounded-full bg-slate-100 text-slate-600 hover:bg-slate-200 text-xs font-semibold transition-all">
        <i data-lucide="refresh-cw" id="syncIcon" class="w-3.5 h-3.5 text-slate-500"></i>
        <span id="syncText">רענן</span>
      </button>
    </div>
  </header>

  <!-- Main Content Container -->
  <main class="max-w-md mx-auto px-4 pt-4 space-y-4">

    <!-- Month Selector Bar -->
    <div class="bg-white rounded-2xl p-2 shadow-sm border border-slate-200/80 flex items-center justify-between">
      <button onclick="changeMonth(-1)" class="w-8 h-8 rounded-xl bg-slate-50 hover:bg-slate-100 flex items-center justify-center text-slate-600 transition-colors">
        <i data-lucide="chevron-right" class="w-5 h-5"></i>
      </button>
      <div class="text-center">
        <span id="currentMonthLabel" class="text-sm font-bold text-slate-800">אוקטובר 2026</span>
      </div>
      <button onclick="changeMonth(1)" class="w-8 h-8 rounded-xl bg-slate-50 hover:bg-slate-100 flex items-center justify-center text-slate-600 transition-colors">
        <i data-lucide="chevron-left" class="w-5 h-5"></i>
      </button>
    </div>

    <!-- Digital Credit Card Hero -->
    <div class="glass-card rounded-3xl p-5 text-white relative overflow-hidden">
      <!-- Decorative background glow -->
      <div class="absolute -right-10 -bottom-10 w-40 h-40 bg-white/10 rounded-full blur-2xl pointer-events-none"></div>

      <div class="flex justify-between items-start mb-4">
        <div>
          <p class="text-indigo-200 text-xs font-medium mb-0.5">יתרה נטו החודש</p>
          <h2 id="netBalance" class="text-2xl sm:text-3xl font-black tracking-tight text-white">₪0</h2>
        </div>
        <button onclick="openModal()" class="bg-white/20 hover:bg-white/30 backdrop-blur-md text-white p-2 rounded-2xl transition-all active:scale-95">
          <i data-lucide="plus" class="w-5 h-5"></i>
        </button>
      </div>

      <!-- Income & Expense Stats -->
      <div class="grid grid-cols-2 gap-3 pt-3 border-t border-white/15">
        <div class="flex items-center gap-2.5">
          <div class="w-8 h-8 rounded-xl bg-emerald-500/20 border border-emerald-400/30 flex items-center justify-center text-emerald-300">
            <i data-lucide="arrow-down-left" class="w-4 h-4"></i>
          </div>
          <div>
            <p class="text-[10px] text-indigo-200 font-medium">הכנסות</p>
            <p id="totalIncome" class="text-xs sm:text-sm font-bold text-emerald-300">₪0</p>
          </div>
        </div>

        <div class="flex items-center gap-2.5">
          <div class="w-8 h-8 rounded-xl bg-rose-500/20 border border-rose-400/30 flex items-center justify-center text-rose-300">
            <i data-lucide="arrow-up-right" class="w-4 h-4"></i>
          </div>
          <div>
            <p class="text-[10px] text-indigo-200 font-medium">הוצאות</p>
            <p id="totalExpenses" class="text-xs sm:text-sm font-bold text-rose-300">₪0</p>
          </div>
        </div>
      </div>
    </div>

    <!-- View Tabs (Dashboard vs Analytics) -->
    <div id="tabDashboard" class="space-y-4">

      <!-- Main Overview Chart (Pie / Doughnut) -->
      <div class="bg-white rounded-3xl p-4 sm:p-5 shadow-sm border border-slate-200/80">
        <div class="flex items-center justify-between mb-3">
          <h3 class="text-xs font-bold text-slate-800 flex items-center gap-2">
            <i data-lucide="pie-chart" class="w-4 h-4 text-indigo-600"></i>
            תמונה כללית - התפלגות הוצאות
          </h3>
        </div>

        <div id="chartContainer" class="relative h-48 w-full flex justify-center items-center">
          <canvas id="expensesChartHome"></canvas>
        </div>
        
        <p id="noChartText" class="text-center text-slate-400 text-xs py-6 hidden">אין הוצאות רשומות בחודש זה</p>
      </div>

      <!-- Recent Transactions Section -->
      <div class="bg-white rounded-3xl p-4 shadow-sm border border-slate-200/80">
        <div class="flex items-center justify-between mb-3.5">
          <h3 class="text-xs font-bold text-slate-800 flex items-center gap-2">
            <i data-lucide="list-filter" class="w-4 h-4 text-indigo-600"></i>
            פירוט תנועות החודש
          </h3>
          <span id="txCount" class="text-[11px] font-semibold text-slate-400">0 תנועות</span>
        </div>

        <div id="transactionsList" class="space-y-2.5 max-h-[300px] overflow-y-auto pr-0.5">
          <p class="text-center text-slate-400 text-xs py-8">טוען נתונים...</p>
        </div>
      </div>

    </div>

    <!-- Analytics Tab Content -->
    <div id="tabAnalytics" class="hidden space-y-4">
      <div class="bg-white rounded-3xl p-5 shadow-sm border border-slate-200/80">
        <h3 class="text-xs font-bold text-slate-800 mb-4 flex items-center gap-2">
          <i data-lucide="bar-chart-2" class="w-4 h-4 text-indigo-600"></i>
          ניתוח קטגוריות מורחב
        </h3>
        <div class="relative h-60 w-full flex justify-center items-center">
          <canvas id="expensesChartAnalytics"></canvas>
        </div>
      </div>
    </div>

  </main>

  <!-- Bottom Navigation Bar -->
  <nav class="fixed bottom-0 left-0 right-0 bg-white/90 backdrop-blur-lg border-t border-slate-200/80 z-20">
    <div class="max-w-md mx-auto px-6 py-2 flex items-center justify-between">
      
      <!-- Home Tab Button -->
      <button onclick="switchTab('dashboard')" id="navHome" class="flex flex-col items-center gap-1 text-indigo-600 transition-colors">
        <i data-lucide="home" class="w-5 h-5"></i>
        <span class="text-[10px] font-bold">ראשי</span>
      </button>

      <!-- Center Floating Action Button (FAB) -->
      <button onclick="openModal()" class="-mt-6 w-13 h-13 bg-indigo-600 hover:bg-indigo-700 active:scale-95 rounded-full text-white shadow-lg shadow-indigo-300 flex items-center justify-center border-4 border-slate-100 transition-all">
        <i data-lucide="plus" class="w-6 h-6"></i>
      </button>

      <!-- Analytics Tab Button -->
      <button onclick="switchTab('analytics')" id="navAnalytics" class="flex flex-col items-center gap-1 text-slate-400 hover:text-slate-600 transition-colors">
        <i data-lucide="pie-chart" class="w-5 h-5"></i>
        <span class="text-[10px] font-bold">דוחות</span>
      </button>

    </div>
  </nav>

  <!-- Add Transaction Bottom Sheet Modal -->
  <div id="modalOverlay" onclick="closeModal()" class="fixed inset-0 bg-slate-900/40 backdrop-blur-sm z-40 hidden transition-opacity opacity-0"></div>

  <div id="addModal" class="modal-sheet closed fixed bottom-0 left-0 right-0 z-50 max-w-md mx-auto bg-white rounded-t-3xl shadow-2xl p-5 border-t border-slate-100">
    <div class="w-12 h-1.5 bg-slate-200 rounded-full mx-auto mb-4"></div>

    <div class="flex items-center justify-between mb-4">
      <h3 class="text-base font-bold text-slate-900 flex items-center gap-2">
        <i data-lucide="plus-circle" class="w-5 h-5 text-indigo-600"></i>
        דיווח תנועה חדשה
      </h3>
      <button onclick="closeModal()" class="p-1 rounded-full text-slate-400 hover:bg-slate-100">
        <i data-lucide="x" class="w-5 h-5"></i>
      </button>
    </div>

    <form id="transactionForm" class="space-y-4">
      <!-- Income / Expense Toggle -->
      <div class="grid grid-cols-2 gap-1.5 p-1 bg-slate-100 rounded-2xl">
        <button type="button" id="btnExpense" onclick="setType('expense')" 
          class="py-2.5 rounded-xl text-xs font-bold transition-all shadow-sm bg-rose-600 text-white flex items-center justify-center gap-1.5">
          <i data-lucide="minus-circle" class="w-4 h-4"></i>
          הוצאה
        </button>
        <button type="button" id="btnIncome" onclick="setType('income')" 
          class="py-2.5 rounded-xl text-xs font-bold transition-all text-slate-600 hover:text-slate-800 flex items-center justify-center gap-1.5">
          <i data-lucide="plus-circle" class="w-4 h-4"></i>
          הכנסה
        </button>
      </div>

      <!-- Amount & Date Fields -->
      <div class="grid grid-cols-2 gap-3">
        <div>
          <label class="block text-[11px] font-bold text-slate-600 mb-1">סכום (₪)</label>
          <input type="number" id="amount" step="0.01" required placeholder="0.00"
            class="w-full text-base font-bold px-3.5 py-2.5 border border-slate-200 rounded-2xl focus:ring-2 focus:ring-indigo-500 focus:outline-none bg-slate-50/50" />
        </div>
        <div>
          <label class="block text-[11px] font-bold text-slate-600 mb-1">תאריך</label>
          <input type="date" id="date" required
            class="w-full px-3.5 py-2.5 border border-slate-200 rounded-2xl text-xs sm:text-sm font-semibold focus:ring-2 focus:ring-indigo-500 focus:outline-none bg-slate-50/50" />
        </div>
      </div>

      <!-- Category Selector Grid -->
      <div>
        <label class="block text-[11px] font-bold text-slate-600 mb-2">קטגוריה</label>
        <div id="categoryGrid" class="grid grid-cols-4 gap-2">
          <!-- Dynamic Categories -->
        </div>
      </div>

      <!-- Description Note -->
      <div>
        <label class="block text-[11px] font-bold text-slate-600 mb-1">תיאור / הערה</label>
        <input type="text" id="description" placeholder="למשל: סופרמרקט, דלק..."
          class="w-full px-3.5 py-2.5 border border-slate-200 rounded-2xl text-xs sm:text-sm focus:ring-2 focus:ring-indigo-500 focus:outline-none bg-slate-50/50" />
      </div>

      <!-- Submit Button -->
      <button type="submit" id="submitBtn"
        class="w-full bg-indigo-600 hover:bg-indigo-700 active:scale-[0.99] text-white font-bold py-3.5 rounded-2xl shadow-lg shadow-indigo-200 transition-all flex items-center justify-center gap-2 text-sm">
        <i data-lucide="send" class="w-4 h-4"></i>
        שמור תנועה
      </button>
    </form>
  </div>

  <script>
    // --- Google Apps Script Web App URL ---
    const GOOGLE_SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbyBNdZ4gvpFLdedF1SUbhDGGMBXnWaR1BQUNYWkL0pR3VFSFOk5mLTsTbHDiTrpalCK/exec';

    // Categories Configuration
    const categories = [
      { id: 'supermarket', name: 'סופרמרקט', icon: 'shopping-cart', color: '#10b981' },
      { id: 'housing', name: 'דיור וחשבונות', icon: 'home', color: '#3b82f6' },
      { id: 'transport', name: 'רכב ותחבורה', icon: 'car', color: '#f59e0b' },
      { id: 'eating_out', name: 'מסעדות ובילוי', icon: 'utensils', color: '#f97316' },
      { id: 'health', name: 'בריאות ופארם', icon: 'heart-pulse', color: '#f43f5e' },
      { id: 'kids', name: 'ילדים וחינוך', icon: 'baby', color: '#a855f7' },
      { id: 'shopping', name: 'קניות וביגוד', icon: 'shopping-bag', color: '#ec4899' },
      { id: 'salary', name: 'משכורת/הכנסה', icon: 'banknote', color: '#14b8a6' },
      { id: 'other', name: 'שונות', icon: 'more-horizontal', color: '#64748b' }
    ];

    let currentType = 'expense';
    let selectedCategory = 'supermarket';
    let transactions = [];
    let currentDate = new Date();
    let chartHomeInstance = null;
    let chartAnalyticsInstance = null;

    const monthNames = [
      "ינואר", "פברואר", "מרץ", "אפריל", "מאי", "יוני",
      "יולי", "אוגוסט", "ספטמבר", "אוקטובר", "נובמבר", "דצמבר"
    ];

    document.addEventListener('DOMContentLoaded', () => {
      document.getElementById('date').valueAsDate = new Date();
      renderCategories();
      updateMonthDisplay();
      
      const cachedData = localStorage.getItem('family_budget_txs');
      if (cachedData) {
        try {
          transactions = JSON.parse(cachedData);
          updateUI();
        } catch (e) {
          console.error(e);
        }
      }

      if (window.lucide) lucide.createIcons();
      fetchData();
    });

    function updateMonthDisplay() {
      const monthStr = monthNames[currentDate.getMonth()];
      const yearStr = currentDate.getFullYear();
      document.getElementById('currentMonthLabel').innerText = `${monthStr} ${yearStr}`;
    }

    function changeMonth(delta) {
      currentDate.setMonth(currentDate.getMonth() + delta);
      updateMonthDisplay();
      updateUI();
    }

    function switchTab(tab) {
      const dash = document.getElementById('tabDashboard');
      const analytics = document.getElementById('tabAnalytics');
      const navHome = document.getElementById('navHome');
      const navAnalytics = document.getElementById('navAnalytics');

      if (tab === 'dashboard') {
        dash.classList.remove('hidden');
        analytics.classList.add('hidden');
        navHome.className = 'flex flex-col items-center gap-1 text-indigo-600 transition-colors';
        navAnalytics.className = 'flex flex-col items-center gap-1 text-slate-400 hover:text-slate-600 transition-colors';
      } else {
        dash.classList.add('hidden');
        analytics.classList.remove('hidden');
        navAnalytics.className = 'flex flex-col items-center gap-1 text-indigo-600 transition-colors';
        navHome.className = 'flex flex-col items-center gap-1 text-slate-400 hover:text-slate-600 transition-colors';
      }
    }

    function openModal() {
      const modal = document.getElementById('addModal');
      const overlay = document.getElementById('modalOverlay');
      overlay.classList.remove('hidden');
      setTimeout(() => {
        overlay.classList.remove('opacity-0');
        modal.classList.remove('closed');
      }, 10);
    }

    function closeModal() {
      const modal = document.getElementById('addModal');
      const overlay = document.getElementById('modalOverlay');
      modal.classList.add('closed');
      overlay.classList.add('opacity-0');
      setTimeout(() => {
        overlay.classList.add('hidden');
      }, 300);
    }

    function setType(type) {
      currentType = type;
      const btnExpense = document.getElementById('btnExpense');
      const btnIncome = document.getElementById('btnIncome');

      if (type === 'expense') {
        btnExpense.className = 'py-2.5 rounded-xl text-xs font-bold transition-all shadow-sm bg-rose-600 text-white flex items-center justify-center gap-1.5';
        btnIncome.className = 'py-2.5 rounded-xl text-xs font-bold transition-all text-slate-600 hover:text-slate-800 flex items-center justify-center gap-1.5';
        if (selectedCategory === 'salary') selectCategory('supermarket');
      } else {
        btnIncome.className = 'py-2.5 rounded-xl text-xs font-bold transition-all shadow-sm bg-emerald-600 text-white flex items-center justify-center gap-1.5';
        btnExpense.className = 'py-2.5 rounded-xl text-xs font-bold transition-all text-slate-600 hover:text-slate-800 flex items-center justify-center gap-1.5';
        selectCategory('salary');
      }
    }

    function renderCategories() {
      const grid = document.getElementById('categoryGrid');
      grid.innerHTML = categories.map(cat => {
        const isSelected = cat.id === selectedCategory;
        return `
          <button type="button" onclick="selectCategory('${cat.id}')"
            class="p-2 rounded-2xl border flex flex-col items-center text-center transition-all ${
              isSelected 
                ? 'border-indigo-600 bg-indigo-50 text-indigo-700 shadow-sm font-bold' 
                : 'border-slate-200/80 bg-slate-50/60 text-slate-600 hover:bg-slate-100'
            }">
            <i data-lucide="${cat.icon}" class="w-4 h-4 mb-1"></i>
            <span class="text-[10px] leading-tight">${cat.name}</span>
          </button>
        `;
      }).join('');
      if (window.lucide) lucide.createIcons();
    }

    function selectCategory(id) {
      selectedCategory = id;
      renderCategories();
    }

    document.getElementById('transactionForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const submitBtn = document.getElementById('submitBtn');
      submitBtn.disabled = true;
      submitBtn.innerHTML = '<i data-lucide="refresh-cw" class="w-4 h-4 animate-spin"></i> שומר...';
      if (window.lucide) lucide.createIcons();

      const newTx = {
        id: Date.now(),
        date: document.getElementById('date').value,
        type: currentType,
        amount: parseFloat(document.getElementById('amount').value),
        category: selectedCategory,
        description: document.getElementById('description').value || ''
      };

      transactions.unshift(newTx);
      localStorage.setItem('family_budget_txs', JSON.stringify(transactions));
      updateUI();
      closeModal();

      if (GOOGLE_SCRIPT_URL && GOOGLE_SCRIPT_URL !== 'YOUR_GOOGLE_APPS_SCRIPT_WEB_APP_URL_HERE') {
        try {
          await fetch(GOOGLE_SCRIPT_URL, {
            method: 'POST',
            mode: 'no-cors',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(newTx)
          });
          setTimeout(fetchData, 1000);
        } catch (err) {
          console.error('Save error:', err);
        }
      }

      document.getElementById('amount').value = '';
      document.getElementById('description').value = '';
      submitBtn.disabled = false;
      submitBtn.innerHTML = '<i data-lucide="send" class="w-4 h-4"></i> שמור תנועה';
      if (window.lucide) lucide.createIcons();
    });

    async function fetchData() {
      if (!GOOGLE_SCRIPT_URL || GOOGLE_SCRIPT_URL === 'YOUR_GOOGLE_APPS_SCRIPT_WEB_APP_URL_HERE') {
        return;
      }

      const syncIcon = document.getElementById('syncIcon');
      const syncText = document.getElementById('syncText');
      if (syncIcon) syncIcon.classList.add('animate-spin');
      if (syncText) syncText.innerText = 'מסתנכרן...';

      try {
        const res = await fetch(GOOGLE_SCRIPT_URL + '?t=' + Date.now());
        const data = await res.json();
        
        if (Array.isArray(data)) {
          transactions = data;
          localStorage.setItem('family_budget_txs', JSON.stringify(transactions));
          updateUI();
          if (syncText) syncText.innerText = 'רענן';
        }
      } catch (e) {
        console.error('Fetch error:', e);
        if (syncText) syncText.innerText = 'שגיאה';
      } finally {
        if (syncIcon) syncIcon.classList.remove('animate-spin');
      }
    }

    function updateUI() {
      const selectedYear = currentDate.getFullYear();
      const selectedMonth = currentDate.getMonth();

      const filtered = transactions.filter(tx => {
        if (!tx.date) return false;
        
        let dateStr = String(tx.date).split('T')[0].trim();
        let parts = dateStr.split('-');
        
        if (parts.length === 3) {
          let txYear = parseInt(parts[0], 10);
          let txMonth = parseInt(parts[1], 10) - 1;
          return txYear === selectedYear && txMonth === selectedMonth;
        }
        
        let d = new Date(tx.date);
        return !isNaN(d.getTime()) && d.getFullYear() === selectedYear && d.getMonth() === selectedMonth;
      });

      let incomeSum = 0;
      let expenseSum = 0;
      const categoryTotals = {};

      filtered.forEach(tx => {
        const amt = parseFloat(tx.amount) || 0;
        if (tx.type === 'income') {
          incomeSum += amt;
        } else {
          expenseSum += amt;
          categoryTotals[tx.category] = (categoryTotals[tx.category] || 0) + amt;
        }
      });

      const net = incomeSum - expenseSum;

      document.getElementById('totalIncome').innerText = `₪${incomeSum.toLocaleString()}`;
      document.getElementById('totalExpenses').innerText = `₪${expenseSum.toLocaleString()}`;
      document.getElementById('netBalance').innerText = `₪${net.toLocaleString()}`;

      renderCharts(categoryTotals);

      const listContainer = document.getElementById('transactionsList');
      document.getElementById('txCount').innerText = `${filtered.length} תנועות`;

      if (filtered.length === 0) {
        listContainer.innerHTML = '<p class="text-center text-slate-400 text-xs py-8">אין תנועות רשומות בחודש זה</p>';
        return;
      }

      listContainer.innerHTML = filtered.map(tx => {
        const catObj = categories.find(c => c.id === tx.category) || categories[categories.length - 1];
        const isIncome = tx.type === 'income';
        const displayAmount = (parseFloat(tx.amount) || 0).toLocaleString();
        const displayDate = String(tx.date).split('T')[0];

        return `
          <div class="flex items-center justify-between p-3 rounded-2xl border border-slate-100 bg-slate-50/60 hover:bg-slate-100/60 transition-colors">
            <div class="flex items-center gap-3">
              <div class="p-2.5 rounded-2xl ${isIncome ? 'bg-emerald-100 text-emerald-700' : 'bg-rose-100 text-rose-700'}">
                <i data-lucide="${catObj.icon}" class="w-4 h-4"></i>
              </div>
              <div>
                <p class="text-xs font-bold text-slate-800">${catObj.name}</p>
                <p class="text-[11px] text-slate-400 font-medium">${displayDate} ${tx.description ? '• ' + tx.description : ''}</p>
              </div>
            </div>
            <div class="flex items-center gap-2.5">
              <span class="text-xs sm:text-sm font-extrabold ${isIncome ? 'text-emerald-600' : 'text-slate-800'}">
                ${isIncome ? '+' : '-'}₪${displayAmount}
              </span>
              <button onclick="deleteTransaction(${tx.id})" class="text-slate-300 hover:text-rose-600 p-1 transition-colors" title="מחק">
                <i data-lucide="trash-2" class="w-3.5 h-3.5"></i>
              </button>
            </div>
          </div>
        `;
      }).join('');

      if (window.lucide) lucide.createIcons();
    }

    async function deleteTransaction(id) {
      if (!confirm('האם אתה בטוח שברצונך למחוק תנועה זו?')) return;

      transactions = transactions.filter(tx => tx.id !== id);
      localStorage.setItem('family_budget_txs', JSON.stringify(transactions));
      updateUI();

      if (GOOGLE_SCRIPT_URL && GOOGLE_SCRIPT_URL !== 'YOUR_GOOGLE_APPS_SCRIPT_WEB_APP_URL_HERE') {
        try {
          await fetch(GOOGLE_SCRIPT_URL, {
            method: 'POST',
            mode: 'no-cors',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ action: 'delete', id: id })
          });
        } catch (err) {
          console.error('Delete error:', err);
        }
      }
    }

    function renderCharts(categoryTotals) {
      const keys = Object.keys(categoryTotals);
      const chartContainer = document.getElementById('chartContainer');
      const noChartText = document.getElementById('noChartText');

      if (keys.length === 0) {
        chartContainer.classList.add('hidden');
        noChartText.classList.remove('hidden');
        return;
      }

      chartContainer.classList.remove('hidden');
      noChartText.classList.add('hidden');

      const labels = [];
      const dataValues = [];
      const backgroundColors = [];

      keys.forEach(key => {
        const cat = categories.find(c => c.id === key) || categories[categories.length - 1];
        labels.push(cat.name);
        dataValues.push(categoryTotals[key]);
        backgroundColors.push(cat.color);
      });

      // Render Home Chart
      const ctxHome = document.getElementById('expensesChartHome').getContext('2d');
      if (chartHomeInstance) chartHomeInstance.destroy();

      chartHomeInstance = new Chart(ctxHome, {
        type: 'doughnut',
        data: {
          labels: labels,
          datasets: [{
            data: dataValues,
            backgroundColor: backgroundColors,
            borderWidth: 2,
            borderColor: '#ffffff'
          }]
        },
        options: {
          responsive: true,
          maintainAspectRatio: false,
          plugins: {
            legend: {
              position: 'right',
              labels: {
                font: { family: 'Rubik', size: 10 },
                boxWidth: 10,
                padding: 8
              }
            }
          },
          cutout: '68%'
        }
      });

      // Render Analytics Chart
      const ctxAnalytics = document.getElementById('expensesChartAnalytics').getContext('2d');
      if (chartAnalyticsInstance) chartAnalyticsInstance.destroy();

      chartAnalyticsInstance = new Chart(ctxAnalytics, {
        type: 'doughnut',
        data: {
          labels: labels,
          datasets: [{
            data: dataValues,
            backgroundColor: backgroundColors,
            borderWidth: 2,
            borderColor: '#ffffff'
          }]
        },
        options: {
          responsive: true,
          maintainAspectRatio: false,
          plugins: {
            legend: {
              position: 'bottom',
              labels: {
                font: { family: 'Rubik', size: 11 },
                boxWidth: 12,
                padding: 12
              }
            }
          },
          cutout: '70%'
        }
      });
    }
  </script>
</body>
</html>
