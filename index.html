<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>תזרים משפחתי</title>
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="תזרים משפחתי" />
  <meta name="theme-color" content="#0F1B2D" />
  <link rel="apple-touch-icon" href="https://cdn-icons-png.flaticon.com/512/2845/2845831.png" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Frank+Ruhl+Libre:wght@500;700;900&family=Heebo:wght@400;500;700&display=swap" rel="stylesheet" />
  <script src="https://cdn.tailwindcss.com/3.4.17"></script>
  <script src="https://cdn.jsdelivr.net/npm/lucide@0.462.0/dist/umd/lucide.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.7/dist/chart.umd.min.js"></script>
  <style>
    :root{--bg:#EEF1F4;--surface:#fff;--ink:#0F1B2D;--muted:#5B6878;--line:#E1E6EC;--brand:#0B6E6E;--on-brand:#fff;
      --pos:#12805A;--neg:#C93C34;--hero:#0F1B2D;--hero-ink:#F3F6F9;--hero-muted:#9FB0C3;--track:#2A3A50;--save:#F0C75E}
    @media (prefers-color-scheme:dark){:root{--bg:#0B1115;--surface:#141D24;--ink:#E7EDF2;--muted:#93A1AF;--line:#22303A;
      --brand:#2BB3A8;--on-brand:#06201E;--pos:#3DD6A0;--neg:#FF7A70;--hero:#1B2A35;--track:#2E4251}}
    body{font-family:'Heebo',system-ui,sans-serif;background:var(--bg);color:var(--ink);-webkit-tap-highlight-color:transparent}
    .serif{font-family:'Frank Ruhl Libre',Georgia,serif}
    .num{unicode-bidi:isolate;direction:ltr;display:inline-block}
    .muted{color:var(--muted)}
    header{padding-top:env(safe-area-inset-top);background:color-mix(in srgb,var(--bg) 85%,transparent);backdrop-filter:blur(12px)}
    .pill{background:var(--surface);border:1px solid var(--line);color:var(--muted);border-radius:99px;padding:6px 12px;font-size:12px;font-weight:500;display:flex;gap:6px;align-items:center}
    .month{display:flex;align-items:center;justify-content:space-between}
    .month button{width:40px;height:40px;border-radius:50%;display:flex;align-items:center;justify-content:center;color:var(--muted)}
    .month button:hover{background:var(--surface)}
    .hero{background:var(--hero);color:var(--hero-ink);border-radius:28px;padding:22px 22px 18px}
    .hero .lbl{color:var(--hero-muted);font-size:13px}
    .big{font-size:46px;line-height:1.05;font-weight:900;letter-spacing:-.5px}
    .addbtn{width:44px;height:44px;border-radius:50%;background:var(--hero-ink);color:var(--hero);display:flex;align-items:center;justify-content:center}
    .bar{display:flex;height:10px;border-radius:99px;background:var(--track);overflow:hidden;margin:20px 0 10px}
    .bar i{display:block;height:100%;transition:width .5s cubic-bezier(.16,1,.3,1)}
    .bar .e{background:#FF7A70}.bar .s{background:var(--save)}
    .hero .meta{display:flex;justify-content:space-between;font-size:13px;color:var(--hero-muted)}
    .hero .meta b{color:var(--hero-ink);font-weight:700}
    .hero .rate{margin-top:12px;padding-top:12px;border-top:1px solid #ffffff22;font-size:13px;color:var(--save);font-weight:500}
    .panel{background:var(--surface);border-radius:24px;padding:18px;border:1px solid var(--line)}
    .h3{font-size:14px;font-weight:700}
    .day{font-size:12px;font-weight:700;color:var(--muted);padding:14px 0 4px}
    .day:first-child{padding-top:0}
    .row{display:flex;align-items:center;gap:12px;padding:10px 0;border-bottom:1px solid var(--line)}
    .ico{width:38px;height:38px;border-radius:12px;display:flex;align-items:center;justify-content:center;flex-shrink:0}
    .t1{font-size:14px;font-weight:500}.t2{font-size:12px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
    .amt{font-size:15px;font-weight:700}.pos{color:var(--pos)}
    .del{color:var(--muted);opacity:.6;padding:6px}.del:hover{color:var(--neg);opacity:1}
    .brk .track{height:8px;border-radius:99px;background:var(--line);overflow:hidden}
    nav{padding-bottom:env(safe-area-inset-bottom);background:color-mix(in srgb,var(--surface) 92%,transparent);backdrop-filter:blur(14px);border-top:1px solid var(--line)}
    .nav a,.nav button.n{display:flex;flex-direction:column;align-items:center;gap:3px;font-size:11px;font-weight:700;color:var(--muted)}
    .nav .on{color:var(--brand)}
    .fab{width:56px;height:56px;border-radius:50%;background:var(--brand);color:var(--on-brand);display:flex;align-items:center;justify-content:center;box-shadow:0 8px 20px -6px var(--brand);border:4px solid var(--bg)}
    .sheet{background:var(--surface);border-radius:28px 28px 0 0;transition:transform .3s cubic-bezier(.16,1,.3,1);padding:20px 20px calc(20px + env(safe-area-inset-bottom))}
    .sheet.closed{transform:translateY(100%)}
    .seg{display:grid;grid-template-columns:1fr 1fr;gap:4px;padding:4px;border-radius:16px;background:var(--bg)}
    .seg button{padding:11px;border-radius:12px;font-size:13px;font-weight:700;color:var(--muted)}
    .seg .xe{background:var(--neg);color:#fff}.seg .xi{background:var(--pos);color:#fff}
    .field{width:100%;padding:12px 14px;border-radius:14px;border:1px solid var(--line);background:var(--bg);color:var(--ink);font-size:15px}
    .field:focus{outline:2px solid var(--brand);outline-offset:0}
    .lab{display:block;font-size:12px;font-weight:700;color:var(--muted);margin-bottom:6px}
    .chip{padding:10px 4px;border-radius:14px;border:1px solid var(--line);display:flex;flex-direction:column;align-items:center;gap:5px;font-size:11px;color:var(--muted);text-align:center;line-height:1.2}
    .chip.sel{border-color:var(--brand);color:var(--ink);font-weight:700;background:color-mix(in srgb,var(--brand) 12%,transparent)}
    .save{width:100%;padding:15px;border-radius:16px;background:var(--brand);color:var(--on-brand);font-weight:700;font-size:15px}
    .rep{display:flex;align-items:center;gap:10px;padding:12px 14px;border-radius:14px;border:1px solid var(--line);background:var(--bg);font-size:14px}
    .rep input{width:18px;height:18px;accent-color:var(--brand)}
    ::-webkit-scrollbar{width:0}
    @media (prefers-reduced-motion:reduce){*{transition:none!important}}
  </style>
</head>
<body class="min-h-screen pb-28">

  <header class="sticky top-0 z-30">
    <div class="max-w-md mx-auto px-5 py-3 flex items-center justify-between">
      <h1 class="serif text-xl font-black">תזרים משפחתי</h1>
      <button onclick="fetchData()" class="pill" aria-label="סנכרן">
        <i data-lucide="refresh-cw" id="syncIcon" class="w-3.5 h-3.5"></i><span id="syncText">רענן</span>
      </button>
    </div>
  </header>

  <main class="max-w-md mx-auto px-5 pt-1 space-y-4">
    <div class="month">
      <button onclick="changeMonth(-1)" aria-label="חודש קודם"><i data-lucide="chevron-right" class="w-5 h-5"></i></button>
      <span id="monthLabel" class="serif text-lg font-bold"></span>
      <button onclick="changeMonth(1)" aria-label="חודש הבא"><i data-lucide="chevron-left" class="w-5 h-5"></i></button>
    </div>

    <section class="hero">
      <div class="flex justify-between items-start">
        <div>
          <p class="lbl">נשאר החודש</p>
          <h2 id="netBalance" class="big serif num">₪0</h2>
        </div>
        <button onclick="openModal()" class="addbtn" aria-label="הוסף תנועה"><i data-lucide="plus" class="w-5 h-5"></i></button>
      </div>
      <div class="bar" role="img" aria-label="יחס הוצאות להכנסות"><i id="barExp" class="e"></i><i id="barSave" class="s"></i></div>
      <div class="meta">
        <span>הוצאות <b id="totalExpenses" class="num">₪0</b></span>
        <span>הכנסות <b id="totalIncome" class="num">₪0</b></span>
      </div>
      <p id="saveRate" class="rate"></p>
    </section>

    <div id="tabDashboard" class="space-y-4">
      <div class="panel">
        <h3 class="h3 mb-3">לאן הלך הכסף</h3>
        <div id="chartBox" class="relative h-48 w-full"><canvas id="expensesChartHome"></canvas></div>
        <p id="noChartText" class="text-center muted text-sm py-6 hidden">אין הוצאות בחודש הזה. הוסף תנועה בכפתור +</p>
      </div>
      <div class="panel">
        <div class="flex items-center justify-between mb-2">
          <h3 class="h3">תנועות</h3>
          <span id="txCount" class="text-xs muted"></span>
        </div>
        <div id="transactionsList" class="max-h-[420px] overflow-y-auto"></div>
      </div>
    </div>

    <div id="tabAnalytics" class="hidden">
      <div class="panel">
        <h3 class="h3 mb-4">הוצאות לפי קטגוריה</h3>
        <div id="breakdown" class="space-y-4"></div>
      </div>
    </div>
    <div id="tabRecurring" class="hidden">
      <div class="panel">
        <h3 class="h3 mb-1">תנועות קבועות</h3>
        <p class="text-xs muted mb-3">נרשמות לבד בכל חודש בתאריך שנקבע. כדי להוסיף: הוסף תנועה וסמן "חוזרת כל חודש".</p>
        <div id="recList"></div>
      </div>
    </div>
  </main>

  <nav class="nav fixed bottom-0 left-0 right-0 z-20">
    <div class="max-w-md mx-auto px-6 pt-2 pb-1 grid grid-cols-3 relative">
      <button onclick="switchTab('dashboard')" id="navHome" class="n on"><i data-lucide="home" class="w-5 h-5"></i>ראשי</button>
      <button onclick="switchTab('recurring')" id="navRec" class="n"><i data-lucide="repeat" class="w-5 h-5"></i>קבועות</button>
      <button onclick="switchTab('analytics')" id="navAnalytics" class="n"><i data-lucide="bar-chart-2" class="w-5 h-5"></i>דוחות</button>
      <button onclick="openModal()" class="fab absolute left-5 -top-[72px]" aria-label="הוסף תנועה"><i data-lucide="plus" class="w-6 h-6"></i></button>
    </div>
  </nav>

  <div id="modalOverlay" onclick="closeModal()" class="fixed inset-0 z-40 hidden opacity-0 transition-opacity" style="background:rgba(8,14,22,.55)"></div>

  <div id="addModal" inert aria-hidden="true" role="dialog" aria-label="תנועה חדשה" class="sheet closed fixed bottom-0 left-0 right-0 z-50 max-w-md mx-auto">
    <div class="w-10 h-1 rounded-full mx-auto mb-4" style="background:var(--line)"></div>
    <div class="flex items-center justify-between mb-4">
      <h3 class="serif text-xl font-bold">תנועה חדשה</h3>
      <button type="button" onclick="closeModal()" aria-label="סגור" class="p-1 muted"><i data-lucide="x" class="w-5 h-5"></i></button>
    </div>
    <form id="transactionForm" class="space-y-4">
      <div class="seg">
        <button type="button" id="btnExpense" onclick="setType('expense')">הוצאה</button>
        <button type="button" id="btnIncome" onclick="setType('income')">הכנסה</button>
      </div>
      <div class="grid grid-cols-2 gap-3">
        <div><label for="amount" class="lab">סכום (₪)</label>
          <input type="number" id="amount" class="field font-bold" step="0.01" min="0.01" max="100000000" inputmode="decimal" required placeholder="0.00" /></div>
        <div><label for="date" class="lab">תאריך</label>
          <input type="date" id="date" class="field" required /></div>
      </div>
      <div><span class="lab">קטגוריה</span><div id="categoryGrid" class="grid grid-cols-4 gap-2"></div></div>
      <div><label for="description" class="lab">תיאור</label>
        <input type="text" id="description" class="field" maxlength="200" placeholder="למשל: סופר, דלק..." /></div>
      <label class="rep"><input type="checkbox" id="repeat" /><span>חוזרת כל חודש באותו תאריך</span></label>
      <button type="submit" class="save">שמור תנועה</button>
    </form>
  </div>

  <script>
    // הדבק כאן את כתובת ה-Web App שלך (מתחילה ב-https://script.google.com/macros/s/ ונגמרת ב-/exec)
    const SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbyo2Mz7aIv_egQOxhwwdzZE6eifGYNoPHPTUCm1Uvp7CS5pPwmnfROL3ku7pxU04Vte/exec';
    const LS = { tx: 'fb_txs', queue: 'fb_queue', token: 'budget_token', rec: 'fb_rec' };

    const categories = [
      { id: 'supermarket', name: 'סופרמרקט', icon: 'shopping-cart', color: '#2F9E78', t: 'e' },
      { id: 'housing', name: 'דיור וחשבונות', icon: 'home', color: '#3B6FD1', t: 'e' },
      { id: 'transport', name: 'רכב ותחבורה', icon: 'car', color: '#D99A2B', t: 'e' },
      { id: 'eating_out', name: 'מסעדות ובילוי', icon: 'utensils', color: '#E0743C', t: 'e' },
      { id: 'health', name: 'בריאות ופארם', icon: 'heart-pulse', color: '#D6475B', t: 'e' },
      { id: 'kids', name: 'ילדים וחינוך', icon: 'baby', color: '#8A5CC8', t: 'e' },
      { id: 'shopping', name: 'קניות וביגוד', icon: 'shopping-bag', color: '#C95C97', t: 'e' },
      { id: 'salary', name: 'משכורת/הכנסה', icon: 'banknote', color: '#12805A', t: 'i' },
      { id: 'other', name: 'שונות', icon: 'more-horizontal', color: '#6B7B8C', t: 'b' }
    ];
    const monthNames = ['ינואר','פברואר','מרץ','אפריל','מאי','יוני','יולי','אוגוסט','ספטמבר','אוקטובר','נובמבר','דצמבר'];

    const $ = id => document.getElementById(id);
    const css = v => getComputedStyle(document.documentElement).getPropertyValue(v).trim();
    const fmt = new Intl.NumberFormat('he-IL', { style: 'currency', currency: 'ILS', maximumFractionDigits: 2 });
    const money = c => fmt.format(c / 100);
    const esc = s => String(s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
    const pad = n => String(n).padStart(2, '0');
    const ymd = d => `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;
    const catOf = id => categories.find(c => c.id === id) || categories[categories.length - 1];
    const load = (k, d) => { try { return JSON.parse(localStorage.getItem(k)) ?? d; } catch { return d; } };
    const store = (k, v) => { try { localStorage.setItem(k, JSON.stringify(v)); } catch {} };

    function normDate(v) {
      const s = String(v || '').trim();
      if (/^\d{4}-\d{2}-\d{2}$/.test(s)) return s;
      const d = new Date(s);
      return isNaN(d) ? '' : ymd(d);
    }

    let txs = load(LS.tx, []);
    let queue = load(LS.queue, []);
    let recs = load(LS.rec, []);
    let view = { y: new Date().getFullYear(), m: new Date().getMonth() };
    let type = 'expense', cat = 'supermarket', chart = null, flushing = false;
    const ready = () => SCRIPT_URL.startsWith('https://');
    const persist = () => { store(LS.tx, txs); store(LS.queue, queue); store(LS.rec, recs); };

    // ---------- סנכרון ----------
    function getToken() {
      let t = localStorage.getItem(LS.token);
      if (!t) {
        t = (prompt('קוד גישה:') || '').trim();
        if (t) localStorage.setItem(LS.token, t);
      }
      return t || '';
    }

    async function post(body) {
      const r = await fetch(SCRIPT_URL, {
        method: 'POST',
        headers: { 'Content-Type': 'text/plain;charset=utf-8' },
        body: JSON.stringify({ ...body, token: getToken() })
      });
      const j = await r.json();
      if (j.status === 'unauthorized') { localStorage.removeItem(LS.token); const e = new Error('auth'); e.auth = true; throw e; }
      if (j.status === 'error') { const e = new Error(j.message); e.fatal = true; throw e; }
      return j;
    }

    async function flush() {
      if (flushing || !ready()) return;
      flushing = true;
      try {
        while (queue.length) {
          try { await post(queue[0]); }
          catch (e) { if (!e.fatal) throw e; console.error('נדחה בשרת:', e.message); }
          queue.shift(); persist();
        }
      } catch (e) { console.error(e); if (e.auth) setSync('auth'); }
      finally { flushing = false; }
    }

    function applyQueue(list) {
      let out = list.slice();
      for (const op of queue) {
        if (op.action === 'delete') out = out.filter(t => String(t.id) !== String(op.id));
        else if (op.action === 'add' && !out.some(t => String(t.id) === String(op.tx.id))) out.unshift(op.tx);
      }
      return out;
    }

    function applyQueueRec(list) {
      let out = list.map(x => ({ ...x }));
      for (const op of queue) {
        if (op.action === 'delRec') out = out.filter(r => String(r.id) !== String(op.id));
        else if (op.action === 'addRec' && !out.some(r => String(r.id) === String(op.rec.id))) out.push({ ...op.rec });
        else if (op.action === 'recGen') {
          const r = out.find(r => String(r.id) === String(op.id));
          if (r && op.lastGen > (r.lastGen || '')) r.lastGen = op.lastGen;
        }
      }
      return out;
    }

    function setSync(state) {
      const map = { ok: 'רענן', syncing: 'מסתנכרן...', error: 'אין חיבור', auth: 'קוד שגוי', pending: `ממתין (${queue.length})`, url: 'חסרה כתובת' };
      $('syncText').textContent = map[state] || 'רענן';
      $('syncIcon').classList.toggle('animate-spin', state === 'syncing');
    }
    const syncIdle = () => setSync(queue.length ? 'pending' : 'ok');

    async function fetchData() {
      if (!ready()) return setSync('url');
      setSync('syncing');
      await flush();
      try {
        const r = await fetch(`${SCRIPT_URL}?token=${encodeURIComponent(getToken())}&t=${Date.now()}`);
        const d = await r.json();
        if (d && d.status === 'unauthorized') { localStorage.removeItem(LS.token); return setSync('auth'); }
        if (!Array.isArray(d)) throw new Error('bad response');
        txs = applyQueue(d);
        try {
          const r2 = await fetch(`${SCRIPT_URL}?kind=rec&token=${encodeURIComponent(getToken())}&t=${Date.now()}`);
          const d2 = await r2.json();
          if (Array.isArray(d2) && d2.every(x => x && x.day !== undefined)) recs = applyQueueRec(d2);
        } catch (e) { console.error(e); }
        generate(); persist(); render(); syncIdle();
        if (queue.length) flush().then(syncIdle);
      } catch (e) { console.error(e); setSync('error'); }
    }

    // רושם תנועות קבועות שהגיע זמנן (מזהה קבוע לכל חודש – אין כפילויות בין מכשירים)
    function generate() {
      const today = ymd(new Date()), curKey = today.slice(0, 7);
      recs.forEach(r => {
        let [y, m] = String(r.lastGen || '').split('-').map(Number);
        if (!y) return;
        let key = r.lastGen;
        while (true) {
          m++; if (m > 12) { m = 1; y++; }
          const k = `${y}-${pad(m)}`;
          if (k > curKey) break;
          const date = `${k}-${pad(Math.min(r.day, new Date(y, m, 0).getDate()))}`;
          if (date > today) break;
          const tx = { id: `r_${r.id}_${k}`, date, type: r.type, amount: r.amount, category: r.category, description: r.description };
          if (!txs.some(t => String(t.id) === tx.id)) { txs.unshift(tx); queue.push({ action: 'add', tx }); }
          key = k;
        }
        if (key !== r.lastGen) { r.lastGen = key; queue.push({ action: 'recGen', id: r.id, lastGen: key }); }
      });
      persist();
    }

    // ---------- חישובים ----------
    function monthData(y, m) {
      const key = `${y}-${pad(m + 1)}`;
      const list = txs.filter(t => normDate(t.date).startsWith(key))
        .sort((a, b) => normDate(b.date).localeCompare(normDate(a.date)));
      let inc = 0, exp = 0; const cats = {};
      list.forEach(t => {
        const c = Math.round((parseFloat(t.amount) || 0) * 100);
        if (t.type === 'income') inc += c;
        else { exp += c; cats[t.category] = (cats[t.category] || 0) + c; }
      });
      return { list, inc, exp, cats, rate: inc > 0 ? Math.round((inc - exp) / inc * 100) : null };
    }

    // ---------- תצוגה ----------
    function render() {
      $('monthLabel').textContent = `${monthNames[view.m]} ${view.y}`;
      const cur = monthData(view.y, view.m);
      const prevD = new Date(view.y, view.m - 1, 1);
      const pr = monthData(prevD.getFullYear(), prevD.getMonth());

      $('netBalance').textContent = money(cur.inc - cur.exp);
      $('totalIncome').textContent = money(cur.inc);
      $('totalExpenses').textContent = money(cur.exp);

      const ep = cur.inc > 0 ? Math.min(100, cur.exp / cur.inc * 100) : (cur.exp > 0 ? 100 : 0);
      $('barExp').style.width = ep + '%';
      $('barSave').style.width = (cur.inc > 0 && cur.exp < cur.inc ? 100 - ep : 0) + '%';

      const r = cur.rate;
      $('saveRate').textContent = r === null ? 'אין הכנסות החודש'
        : (r < 0 ? `ההוצאות גבוהות מההכנסות ב-${-r}%` : `נחסכו ${r}% מההכנסות`)
          + (pr.rate !== null ? ` · חודש קודם: ${pr.rate}%` : '');

      const rows = Object.entries(cur.cats).sort((a, b) => b[1] - a[1]);
      drawChart(rows);
      drawBreakdown(rows, cur.exp);

      $('txCount').textContent = `${cur.list.length} תנועות`;
      let html = '', last = '';
      cur.list.forEach(t => {
        const d = normDate(t.date), c = catOf(t.category), inc = t.type === 'income';
        const cents = Math.round((parseFloat(t.amount) || 0) * 100);
        if (d !== last) { last = d; const [, mo, da] = d.split('-'); html += `<h4 class="day">${+da} ב${monthNames[+mo - 1]}</h4>`; }
        html += `
          <div class="row">
            <span class="ico" style="background:${c.color}22;color:${c.color}"><i data-lucide="${c.icon}" class="w-4 h-4"></i></span>
            <div class="min-w-0 flex-1">
              <p class="t1">${c.name}</p>${t.description ? `<p class="t2">${esc(t.description)}</p>` : ''}
            </div>
            <span class="num amt ${inc ? 'pos' : ''}">${inc ? '+' : '−'}${money(cents)}</span>
            <button data-del="${esc(t.id)}" aria-label="מחק" class="del"><i data-lucide="trash-2" class="w-4 h-4"></i></button>
          </div>`;
      });
      $('transactionsList').innerHTML = html || '<p class="text-center muted text-sm py-8">עוד אין תנועות בחודש הזה. הוסף את הראשונה בכפתור +</p>';
      renderRecs();
      lucide.createIcons();
    }

    function renderRecs() {
      $('recList').innerHTML = recs.length ? recs.map(r => {
        const c = catOf(r.category), inc = r.type === 'income';
        return `
          <div class="row">
            <span class="ico" style="background:${c.color}22;color:${c.color}"><i data-lucide="${c.icon}" class="w-4 h-4"></i></span>
            <div class="min-w-0 flex-1">
              <p class="t1">${esc(r.description) || c.name}</p><p class="t2">ב-${r.day} בכל חודש · ${c.name}</p>
            </div>
            <span class="num amt ${inc ? 'pos' : ''}">${inc ? '+' : '−'}${money(Math.round(r.amount * 100))}</span>
            <button data-delrec="${esc(r.id)}" aria-label="הסר" class="del"><i data-lucide="trash-2" class="w-4 h-4"></i></button>
          </div>`;
      }).join('') : '<p class="text-center muted text-sm py-8">עוד אין תנועות קבועות</p>';
    }

    function drawChart(rows) {
      if (chart) { chart.destroy(); chart = null; }
      $('chartBox').classList.toggle('hidden', !rows.length);
      $('noChartText').classList.toggle('hidden', !!rows.length);
      if (!rows.length) return;
      Chart.defaults.color = css('--muted');
      chart = new Chart($('expensesChartHome'), {
        type: 'doughnut',
        data: {
          labels: rows.map(([k]) => catOf(k).name),
          datasets: [{ data: rows.map(([, v]) => v / 100), backgroundColor: rows.map(([k]) => catOf(k).color), borderWidth: 3, borderColor: css('--surface') }]
        },
        options: {
          responsive: true, maintainAspectRatio: false, cutout: '66%',
          plugins: { legend: { position: 'right', labels: { font: { family: 'Heebo', size: 11 }, boxWidth: 10, padding: 9 } } }
        }
      });
    }

    function drawBreakdown(rows, total) {
      $('breakdown').innerHTML = rows.length ? rows.map(([k, v]) => {
        const c = catOf(k), p = total ? Math.round(v / total * 100) : 0;
        return `
          <div class="brk">
            <div class="flex justify-between text-sm mb-1.5">
              <span class="font-medium">${c.name}</span>
              <span class="muted"><span class="num">${money(v)}</span> · ${p}%</span>
            </div>
            <div class="track"><div style="height:100%;border-radius:99px;width:${p}%;background:${c.color}"></div></div>
          </div>`;
      }).join('') : '<p class="text-center muted text-sm py-6">אין הוצאות בחודש הזה</p>';
    }

    function changeMonth(delta) {
      const d = new Date(view.y, view.m + delta, 1);
      view = { y: d.getFullYear(), m: d.getMonth() };
      render();
    }

    function switchTab(tab) {
      [['Dashboard', 'dashboard', 'Home'], ['Recurring', 'recurring', 'Rec'], ['Analytics', 'analytics', 'Analytics']].forEach(([id, t, nv]) => {
        $('tab' + id).classList.toggle('hidden', t !== tab);
        $('nav' + nv).className = 'n' + (t === tab ? ' on' : '');
      });
    }

    // ---------- חלון הוספה ----------
    function openModal() {
      const modal = $('addModal'), overlay = $('modalOverlay');
      modal.inert = false; modal.setAttribute('aria-hidden', 'false');
      overlay.classList.remove('hidden');
      setTimeout(() => { overlay.classList.remove('opacity-0'); modal.classList.remove('closed'); $('amount').focus(); }, 10);
    }
    function closeModal() {
      const modal = $('addModal'), overlay = $('modalOverlay');
      modal.classList.add('closed'); modal.inert = true; modal.setAttribute('aria-hidden', 'true');
      overlay.classList.add('opacity-0');
      setTimeout(() => overlay.classList.add('hidden'), 300);
    }
    document.addEventListener('keydown', e => { if (e.key === 'Escape') closeModal(); });

    function setType(t) {
      type = t;
      $('btnExpense').className = t === 'expense' ? 'xe' : '';
      $('btnIncome').className = t === 'income' ? 'xi' : '';
      cat = t === 'income' ? 'salary' : 'supermarket';
      renderCategories();
    }

    function renderCategories() {
      $('categoryGrid').innerHTML = categories
        .filter(c => c.t === 'b' || c.t === (type === 'income' ? 'i' : 'e'))
        .map(c => `
          <button type="button" onclick="selectCategory('${c.id}')" class="chip ${c.id === cat ? 'sel' : ''}">
            <i data-lucide="${c.icon}" class="w-4 h-4" style="color:${c.color}"></i><span>${c.name}</span>
          </button>`).join('');
      lucide.createIcons();
    }
    function selectCategory(id) { cat = id; renderCategories(); }

    const newId = () => 't' + Date.now().toString(36) + Math.random().toString(36).slice(2, 6);

    $('transactionForm').addEventListener('submit', e => {
      e.preventDefault();
      const amount = Math.round(parseFloat($('amount').value) * 100) / 100;
      if (!(amount > 0) || !$('date').value) return;
      const tx = { id: newId(), date: $('date').value, type, amount, category: cat, description: $('description').value.trim() };
      txs.unshift(tx);
      queue.push({ action: 'add', tx });
      if ($('repeat').checked) {
        const rec = { id: newId(), type, amount, category: cat, description: tx.description, day: +tx.date.slice(8, 10), lastGen: tx.date.slice(0, 7) };
        recs.push(rec); queue.push({ action: 'addRec', rec });
        $('repeat').checked = false;
      }
      persist();
      const [y, m] = tx.date.split('-').map(Number);
      view = { y, m: m - 1 };
      render(); closeModal();
      $('amount').value = ''; $('description').value = ''; $('date').value = ymd(new Date());
      setSync('pending');
      flush().then(syncIdle);
    });

    $('transactionsList').addEventListener('click', e => {
      const b = e.target.closest('[data-del]');
      if (!b || !confirm('למחוק את התנועה?')) return;
      const id = b.dataset.del;
      txs = txs.filter(t => String(t.id) !== id);
      queue.push({ action: 'delete', id });
      persist(); render(); setSync('pending');
      flush().then(syncIdle);
    });

    $('recList').addEventListener('click', e => {
      const b = e.target.closest('[data-delrec]');
      if (!b || !confirm('להפסיק את התנועה הקבועה? תנועות שכבר נרשמו יישארו.')) return;
      const id = b.dataset.delrec;
      recs = recs.filter(r => String(r.id) !== id);
      queue.push({ action: 'delRec', id });
      persist(); render(); setSync('pending');
      flush().then(syncIdle);
    });

    window.addEventListener('online', fetchData);
    matchMedia('(prefers-color-scheme: dark)').addEventListener('change', render);

    document.addEventListener('DOMContentLoaded', () => {
      $('date').value = ymd(new Date());
      setType('expense');
      generate();
      render();
      syncIdle();
      fetchData();
    });
  </script>
</body>
</html>
