<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>תזרים משפחתי</title>
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="תזרים משפחתי" />
  <meta name="theme-color" content="#4f46e5" />
  <link rel="apple-touch-icon" href="https://cdn-icons-png.flaticon.com/512/2845/2845831.png" />

  <script src="https://cdn.tailwindcss.com/3.4.17"></script>
  <script src="https://cdn.jsdelivr.net/npm/lucide@0.462.0/dist/umd/lucide.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.7/dist/chart.umd.min.js"></script>

  <style>
    @import url('https://fonts.googleapis.com/css2?family=Rubik:wght@300..900&display=swap');
    body { font-family: 'Rubik', system-ui, sans-serif; -webkit-tap-highlight-color: transparent; }
    .glass-card {
      background: linear-gradient(135deg, rgba(79,70,229,.95) 0%, rgba(99,102,241,.85) 50%, rgba(124,58,237,.95) 100%);
      box-shadow: 0 12px 32px -8px rgba(79,70,229,.4);
    }
    .num { unicode-bidi: isolate; direction: ltr; display: inline-block; }
    .modal-sheet { transition: transform .3s cubic-bezier(.16,1,.3,1); }
    .modal-sheet.closed { transform: translateY(100%); }
    header { padding-top: env(safe-area-inset-top); }
    nav { padding-bottom: env(safe-area-inset-bottom); }
    ::-webkit-scrollbar { width: 0; }
  </style>
</head>
<body class="bg-slate-100 text-slate-800 min-h-screen pb-28">

  <header class="bg-white/80 backdrop-blur-md sticky top-0 z-30 border-b border-slate-200/60">
    <div class="max-w-md mx-auto px-4 py-3 flex items-center justify-between">
      <div class="flex items-center gap-2.5">
        <div class="w-9 h-9 bg-indigo-600 rounded-xl flex items-center justify-center text-white shadow-md shadow-indigo-200">
          <i data-lucide="wallet" class="w-5 h-5"></i>
        </div>
        <div>
          <h1 class="text-sm font-bold text-slate-900 leading-tight">תזרים משפחתי</h1>
          <p class="text-[11px] text-slate-500 font-medium">ניהול תקציב וחיסכון</p>
        </div>
      </div>
      <button onclick="fetchData()" class="flex items-center gap-1.5 px-3 py-1.5 rounded-full bg-slate-100 text-slate-600 hover:bg-slate-200 text-xs font-semibold transition-all">
        <i data-lucide="refresh-cw" id="syncIcon" class="w-3.5 h-3.5"></i>
        <span id="syncText">רענן</span>
      </button>
    </div>
  </header>

  <main class="max-w-md mx-auto px-4 pt-4 space-y-4">

    <div class="bg-white rounded-2xl p-2 shadow-sm border border-slate-200/80 flex items-center justify-between">
      <button onclick="changeMonth(-1)" aria-label="חודש קודם" class="w-9 h-9 rounded-xl bg-slate-50 hover:bg-slate-100 flex items-center justify-center text-slate-600">
        <i data-lucide="chevron-right" class="w-5 h-5"></i>
      </button>
      <span id="monthLabel" class="text-sm font-bold text-slate-800"></span>
      <button onclick="changeMonth(1)" aria-label="חודש הבא" class="w-9 h-9 rounded-xl bg-slate-50 hover:bg-slate-100 flex items-center justify-center text-slate-600">
        <i data-lucide="chevron-left" class="w-5 h-5"></i>
      </button>
    </div>

    <div class="glass-card rounded-3xl p-5 text-white relative overflow-hidden">
      <div class="flex justify-between items-start mb-4">
        <div>
          <p class="text-indigo-100 text-xs font-medium mb-0.5">יתרה נטו החודש</p>
          <h2 id="netBalance" class="num text-3xl font-black tracking-tight">₪0</h2>
        </div>
        <button onclick="openModal()" aria-label="הוסף תנועה" class="bg-white/20 hover:bg-white/30 text-white p-2 rounded-2xl active:scale-95 transition-all">
          <i data-lucide="plus" class="w-5 h-5"></i>
        </button>
      </div>
      <div class="grid grid-cols-2 gap-3 pt-3 border-t border-white/15">
        <div>
          <p class="text-[11px] text-indigo-100 font-medium">הכנסות</p>
          <p id="totalIncome" class="num text-sm font-bold text-emerald-300">₪0</p>
        </div>
        <div>
          <p class="text-[11px] text-indigo-100 font-medium">הוצאות</p>
          <p id="totalExpenses" class="num text-sm font-bold text-rose-300">₪0</p>
        </div>
      </div>
      <p id="saveRate" class="text-xs text-indigo-50 mt-3 pt-3 border-t border-white/15"></p>
    </div>

    <div id="tabDashboard" class="space-y-4">
      <div class="bg-white rounded-3xl p-4 shadow-sm border border-slate-200/80">
        <h3 class="text-xs font-bold text-slate-800 flex items-center gap-2 mb-3">
          <i data-lucide="pie-chart" class="w-4 h-4 text-indigo-600"></i> התפלגות הוצאות
        </h3>
        <div id="chartBox" class="relative h-48 w-full"><canvas id="expensesChartHome"></canvas></div>
        <p id="noChartText" class="text-center text-slate-500 text-xs py-6 hidden">אין הוצאות בחודש זה. הוסף תנועה בכפתור +</p>
      </div>

      <div class="bg-white rounded-3xl p-4 shadow-sm border border-slate-200/80">
        <div class="flex items-center justify-between mb-3.5">
          <h3 class="text-xs font-bold text-slate-800 flex items-center gap-2">
            <i data-lucide="list-filter" class="w-4 h-4 text-indigo-600"></i> תנועות החודש
          </h3>
          <span id="txCount" class="text-[11px] font-semibold text-slate-500"></span>
        </div>
        <div id="transactionsList" class="space-y-2.5 max-h-[340px] overflow-y-auto"></div>
      </div>
    </div>

    <div id="tabAnalytics" class="hidden">
      <div class="bg-white rounded-3xl p-5 shadow-sm border border-slate-200/80">
        <h3 class="text-xs font-bold text-slate-800 mb-4 flex items-center gap-2">
          <i data-lucide="bar-chart-2" class="w-4 h-4 text-indigo-600"></i> הוצאות לפי קטגוריה
        </h3>
        <div id="breakdown" class="space-y-3.5"></div>
      </div>
    </div>
  </main>

  <nav class="fixed bottom-0 left-0 right-0 bg-white/90 backdrop-blur-lg border-t border-slate-200/80 z-20">
    <div class="max-w-md mx-auto px-6 py-2 flex items-center justify-between">
      <button onclick="switchTab('dashboard')" id="navHome" class="flex flex-col items-center gap-1 text-indigo-600">
        <i data-lucide="home" class="w-5 h-5"></i><span class="text-[10px] font-bold">ראשי</span>
      </button>
      <button onclick="openModal()" aria-label="הוסף תנועה" class="-mt-6 w-14 h-14 bg-indigo-600 hover:bg-indigo-700 active:scale-95 rounded-full text-white shadow-lg shadow-indigo-300 flex items-center justify-center border-4 border-slate-100 transition-all">
        <i data-lucide="plus" class="w-6 h-6"></i>
      </button>
      <button onclick="switchTab('analytics')" id="navAnalytics" class="flex flex-col items-center gap-1 text-slate-500">
        <i data-lucide="bar-chart-2" class="w-5 h-5"></i><span class="text-[10px] font-bold">דוחות</span>
      </button>
    </div>
  </nav>

  <div id="modalOverlay" onclick="closeModal()" class="fixed inset-0 bg-slate-900/40 backdrop-blur-sm z-40 hidden opacity-0 transition-opacity"></div>

  <div id="addModal" inert aria-hidden="true" role="dialog" aria-label="דיווח תנועה חדשה" class="modal-sheet closed fixed bottom-0 left-0 right-0 z-50 max-w-md mx-auto bg-white rounded-t-3xl shadow-2xl p-5 border-t border-slate-100">
    <div class="w-12 h-1.5 bg-slate-200 rounded-full mx-auto mb-4"></div>
    <div class="flex items-center justify-between mb-4">
      <h3 class="text-base font-bold text-slate-900">תנועה חדשה</h3>
      <button type="button" onclick="closeModal()" aria-label="סגור" class="p-1 rounded-full text-slate-500 hover:bg-slate-100">
        <i data-lucide="x" class="w-5 h-5"></i>
      </button>
    </div>

    <form id="transactionForm" class="space-y-4">
      <div class="grid grid-cols-2 gap-1.5 p-1 bg-slate-100 rounded-2xl">
        <button type="button" id="btnExpense" onclick="setType('expense')" class="py-2.5 rounded-xl text-xs font-bold transition-all">הוצאה</button>
        <button type="button" id="btnIncome" onclick="setType('income')" class="py-2.5 rounded-xl text-xs font-bold transition-all">הכנסה</button>
      </div>

      <div class="grid grid-cols-2 gap-3">
        <div>
          <label for="amount" class="block text-[11px] font-bold text-slate-600 mb-1">סכום (₪)</label>
          <input type="number" id="amount" step="0.01" min="0.01" max="100000000" inputmode="decimal" required placeholder="0.00"
            class="w-full text-base font-bold px-3.5 py-2.5 border border-slate-200 rounded-2xl focus:ring-2 focus:ring-indigo-500 focus:outline-none bg-slate-50/50" />
        </div>
        <div>
          <label for="date" class="block text-[11px] font-bold text-slate-600 mb-1">תאריך</label>
          <input type="date" id="date" required
            class="w-full px-3.5 py-2.5 border border-slate-200 rounded-2xl text-sm font-semibold focus:ring-2 focus:ring-indigo-500 focus:outline-none bg-slate-50/50" />
        </div>
      </div>

      <div>
        <span class="block text-[11px] font-bold text-slate-600 mb-2">קטגוריה</span>
        <div id="categoryGrid" class="grid grid-cols-4 gap-2"></div>
      </div>

      <div>
        <label for="description" class="block text-[11px] font-bold text-slate-600 mb-1">תיאור</label>
        <input type="text" id="description" maxlength="200" placeholder="למשל: סופרמרקט, דלק..."
          class="w-full px-3.5 py-2.5 border border-slate-200 rounded-2xl text-sm focus:ring-2 focus:ring-indigo-500 focus:outline-none bg-slate-50/50" />
      </div>

      <button type="submit" class="w-full bg-indigo-600 hover:bg-indigo-700 active:scale-[0.99] text-white font-bold py-3.5 rounded-2xl shadow-lg shadow-indigo-200 transition-all text-sm">
        שמור תנועה
      </button>
    </form>
  </div>

  <script>
    const SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbyo2Mz7aIv_egQOxhwwdzZE6eifGYNoPHPTUCm1Uvp7CS5pPwmnfROL3ku7pxU04Vte/exec';
    const LS = { tx: 'fb_txs', queue: 'fb_queue', token: 'budget_token' };

    // t: e = הוצאה, i = הכנסה, b = שניהם
    const categories = [
      { id: 'supermarket', name: 'סופרמרקט', icon: 'shopping-cart', color: '#10b981', t: 'e' },
      { id: 'housing', name: 'דיור וחשבונות', icon: 'home', color: '#3b82f6', t: 'e' },
      { id: 'transport', name: 'רכב ותחבורה', icon: 'car', color: '#f59e0b', t: 'e' },
      { id: 'eating_out', name: 'מסעדות ובילוי', icon: 'utensils', color: '#f97316', t: 'e' },
      { id: 'health', name: 'בריאות ופארם', icon: 'heart-pulse', color: '#f43f5e', t: 'e' },
      { id: 'kids', name: 'ילדים וחינוך', icon: 'baby', color: '#a855f7', t: 'e' },
      { id: 'shopping', name: 'קניות וביגוד', icon: 'shopping-bag', color: '#ec4899', t: 'e' },
      { id: 'salary', name: 'משכורת/הכנסה', icon: 'banknote', color: '#14b8a6', t: 'i' },
      { id: 'other', name: 'שונות', icon: 'more-horizontal', color: '#64748b', t: 'b' }
    ];
    const monthNames = ['ינואר','פברואר','מרץ','אפריל','מאי','יוני','יולי','אוגוסט','ספטמבר','אוקטובר','נובמבר','דצמבר'];

    const $ = id => document.getElementById(id);
    const fmt = new Intl.NumberFormat('he-IL', { style: 'currency', currency: 'ILS', maximumFractionDigits: 2 });
    const money = cents => fmt.format(cents / 100);
    const esc = s => String(s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
    const pad = n => String(n).padStart(2, '0');
    const ymd = d => `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;
    const catOf = id => categories.find(c => c.id === id) || categories[categories.length - 1];
    const load = (k, d) => { try { return JSON.parse(localStorage.getItem(k)) ?? d; } catch { return d; } };
    const store = (k, v) => { try { localStorage.setItem(k, JSON.stringify(v)); } catch {} };

    // תאריך תמיד כ-yyyy-MM-dd לפי השעון המקומי (גם אם הגיע ISO ב-UTC)
    function normDate(v) {
      const s = String(v || '').trim();
      if (/^\d{4}-\d{2}-\d{2}$/.test(s)) return s;
      const d = new Date(s);
      return isNaN(d) ? '' : ymd(d);
    }

    let txs = load(LS.tx, []);
    let queue = load(LS.queue, []);   // פעולות שעוד לא אושרו בשרת
    let view = { y: new Date().getFullYear(), m: new Date().getMonth() };
    let type = 'expense', cat = 'supermarket', chart = null, flushing = false;

    const persist = () => { store(LS.tx, txs); store(LS.queue, queue); };

    // ---------- סנכרון ----------
    function getToken() {
      let t = localStorage.getItem(LS.token);
      if (!t) {
        t = (prompt('קוד גישה:') || '').trim();
        if (t) localStorage.setItem(LS.token, t);
      }
      return t || '';
    }

    async function post(body) {
      const r = await fetch(SCRIPT_URL, {
        method: 'POST',
        headers: { 'Content-Type': 'text/plain;charset=utf-8' }, // בקשה "פשוטה" – בלי preflight
        body: JSON.stringify({ ...body, token: getToken() })
      });
      const j = await r.json();
      if (j.status === 'unauthorized') { localStorage.removeItem(LS.token); const e = new Error('auth'); e.auth = true; throw e; }
      if (j.status === 'error') { const e = new Error(j.message); e.fatal = true; throw e; }
      return j;
    }

    async function flush() {
      if (flushing) return;
      flushing = true;
      try {
        while (queue.length) {
          try { await post(queue[0]); }
          catch (e) { if (!e.fatal) throw e; console.error('נדחה בשרת:', e.message); }
          queue.shift(); persist();
        }
      } catch (e) { console.error(e); if (e.auth) setSync('auth'); }
      finally { flushing = false; }
    }

    function applyQueue(list) {
      let out = list.slice();
      for (const op of queue) {
        if (op.action === 'delete') out = out.filter(t => String(t.id) !== String(op.id));
        else if (!out.some(t => String(t.id) === String(op.tx.id))) out.unshift(op.tx);
      }
      return out;
    }

    function setSync(state) {
      const map = { ok: 'רענן', syncing: 'מסתנכרן...', error: 'אין חיבור', auth: 'קוד שגוי', pending: `ממתין (${queue.length})` };
      $('syncText').textContent = map[state] || 'רענן';
      $('syncIcon').classList.toggle('animate-spin', state === 'syncing');
    }
    const syncIdle = () => setSync(queue.length ? 'pending' : 'ok');

    async function fetchData() {
      setSync('syncing');
      await flush();
      try {
        const r = await fetch(`${SCRIPT_URL}?token=${encodeURIComponent(getToken())}&t=${Date.now()}`);
        const d = await r.json();
        if (d && d.status === 'unauthorized') { localStorage.removeItem(LS.token); return setSync('auth'); }
        if (!Array.isArray(d)) throw new Error('bad response');
        txs = applyQueue(d); persist(); render(); syncIdle();
      } catch (e) { console.error(e); setSync('error'); }
    }

    // ---------- חישובים ----------
    function monthData(y, m) {
      const key = `${y}-${pad(m + 1)}`;
      const list = txs.filter(t => normDate(t.date).startsWith(key))
        .sort((a, b) => normDate(b.date).localeCompare(normDate(a.date)));
      let inc = 0, exp = 0; const cats = {};
      list.forEach(t => {
        const c = Math.round((parseFloat(t.amount) || 0) * 100); // אגורות – בלי שגיאות עיגול
        if (t.type === 'income') inc += c;
        else { exp += c; cats[t.category] = (cats[t.category] || 0) + c; }
      });
      return { list, inc, exp, cats, rate: inc > 0 ? Math.round((inc - exp) / inc * 100) : null };
    }

    // ---------- תצוגה ----------
    function render() {
      $('monthLabel').textContent = `${monthNames[view.m]} ${view.y}`;
      const cur = monthData(view.y, view.m);
      const prev = new Date(view.y, view.m - 1, 1);
      const pr = monthData(prev.getFullYear(), prev.getMonth());

      $('netBalance').textContent = money(cur.inc - cur.exp);
      $('totalIncome').textContent = money(cur.inc);
      $('totalExpenses').textContent = money(cur.exp);
      $('saveRate').textContent = cur.rate === null
        ? 'שיעור חיסכון: אין הכנסות החודש'
        : `שיעור חיסכון: ${cur.rate}%` + (pr.rate !== null ? ` (חודש קודם: ${pr.rate}%)` : '');

      const rows = Object.entries(cur.cats).sort((a, b) => b[1] - a[1]);
      drawChart(rows);
      drawBreakdown(rows, cur.exp);

      $('txCount').textContent = `${cur.list.length} תנועות`;
      $('transactionsList').innerHTML = cur.list.length ? cur.list.map(t => {
        const c = catOf(t.category), inc = t.type === 'income';
        const cents = Math.round((parseFloat(t.amount) || 0) * 100);
        return `
          <div class="flex items-center justify-between p-3 rounded-2xl border border-slate-100 bg-slate-50/60">
            <div class="flex items-center gap-3 min-w-0">
              <div class="p-2.5 rounded-2xl shrink-0 ${inc ? 'bg-emerald-100 text-emerald-700' : 'bg-rose-100 text-rose-700'}">
                <i data-lucide="${c.icon}" class="w-4 h-4"></i>
              </div>
              <div class="min-w-0">
                <p class="text-xs font-bold text-slate-800">${c.name}</p>
                <p class="text-[11px] text-slate-500 truncate">${esc(normDate(t.date))}${t.description ? ' • ' + esc(t.description) : ''}</p>
              </div>
            </div>
            <div class="flex items-center gap-2 shrink-0">
              <span class="num text-sm font-extrabold ${inc ? 'text-emerald-600' : 'text-slate-800'}">${inc ? '+' : '-'}${money(cents)}</span>
              <button data-del="${esc(t.id)}" aria-label="מחק" class="text-slate-400 hover:text-rose-600 p-1.5">
                <i data-lucide="trash-2" class="w-4 h-4"></i>
              </button>
            </div>
          </div>`;
      }).join('') : '<p class="text-center text-slate-500 text-xs py-8">אין תנועות בחודש זה</p>';

      lucide.createIcons();
    }

    function drawChart(rows) {
      if (chart) { chart.destroy(); chart = null; }
      $('chartBox').classList.toggle('hidden', !rows.length);
      $('noChartText').classList.toggle('hidden', !!rows.length);
      if (!rows.length) return;
      chart = new Chart($('expensesChartHome'), {
        type: 'doughnut',
        data: {
          labels: rows.map(([k]) => catOf(k).name),
          datasets: [{ data: rows.map(([, v]) => v / 100), backgroundColor: rows.map(([k]) => catOf(k).color), borderWidth: 2, borderColor: '#fff' }]
        },
        options: {
          responsive: true, maintainAspectRatio: false, cutout: '68%',
          plugins: { legend: { position: 'right', labels: { font: { family: 'Rubik', size: 10 }, boxWidth: 10, padding: 8 } } }
        }
      });
    }

    function drawBreakdown(rows, total) {
      $('breakdown').innerHTML = rows.length ? rows.map(([k, v]) => {
        const c = catOf(k), p = total ? Math.round(v / total * 100) : 0;
        return `
          <div>
            <div class="flex justify-between text-xs mb-1">
              <span class="font-semibold">${c.name}</span>
              <span class="text-slate-500"><span class="num">${money(v)}</span> · ${p}%</span>
            </div>
            <div class="h-2 rounded-full bg-slate-100 overflow-hidden">
              <div class="h-full rounded-full" style="width:${p}%;background:${c.color}"></div>
            </div>
          </div>`;
      }).join('') : '<p class="text-center text-slate-500 text-xs py-6">אין הוצאות בחודש זה</p>';
    }

    function changeMonth(delta) {
      const d = new Date(view.y, view.m + delta, 1); // יום 1 – אין דילוג חודשים
      view = { y: d.getFullYear(), m: d.getMonth() };
      render();
    }

    function switchTab(tab) {
      const dash = tab === 'dashboard';
      $('tabDashboard').classList.toggle('hidden', !dash);
      $('tabAnalytics').classList.toggle('hidden', dash);
      $('navHome').className = `flex flex-col items-center gap-1 ${dash ? 'text-indigo-600' : 'text-slate-500'}`;
      $('navAnalytics').className = `flex flex-col items-center gap-1 ${dash ? 'text-slate-500' : 'text-indigo-600'}`;
    }

    // ---------- חלון הוספה ----------
    function openModal() {
      const modal = $('addModal'), overlay = $('modalOverlay');
      modal.inert = false; modal.setAttribute('aria-hidden', 'false');
      overlay.classList.remove('hidden');
      setTimeout(() => { overlay.classList.remove('opacity-0'); modal.classList.remove('closed'); $('amount').focus(); }, 10);
    }
    function closeModal() {
      const modal = $('addModal'), overlay = $('modalOverlay');
      modal.classList.add('closed'); modal.inert = true; modal.setAttribute('aria-hidden', 'true');
      overlay.classList.add('opacity-0');
      setTimeout(() => overlay.classList.add('hidden'), 300);
    }
    document.addEventListener('keydown', e => { if (e.key === 'Escape') closeModal(); });

    function setType(t) {
      type = t;
      const on = t === 'expense' ? 'bg-rose-600 text-white shadow-sm' : 'bg-emerald-600 text-white shadow-sm';
      const off = 'text-slate-600 hover:text-slate-800';
      $('btnExpense').className = `py-2.5 rounded-xl text-xs font-bold transition-all ${t === 'expense' ? on : off}`;
      $('btnIncome').className = `py-2.5 rounded-xl text-xs font-bold transition-all ${t === 'income' ? on : off}`;
      cat = t === 'income' ? 'salary' : 'supermarket';
      renderCategories();
    }

    function renderCategories() {
      $('categoryGrid').innerHTML = categories
        .filter(c => c.t === 'b' || c.t === (type === 'income' ? 'i' : 'e'))
        .map(c => `
          <button type="button" onclick="selectCategory('${c.id}')"
            class="p-2 rounded-2xl border flex flex-col items-center text-center transition-all ${
              c.id === cat ? 'border-indigo-600 bg-indigo-50 text-indigo-700 font-bold' : 'border-slate-200/80 bg-slate-50/60 text-slate-600 hover:bg-slate-100'}">
            <i data-lucide="${c.icon}" class="w-4 h-4 mb-1"></i>
            <span class="text-[10px] leading-tight">${c.name}</span>
          </button>`).join('');
      lucide.createIcons();
    }
    function selectCategory(id) { cat = id; renderCategories(); }

    const newId = () => 't' + Date.now().toString(36) + Math.random().toString(36).slice(2, 6);

    $('transactionForm').addEventListener('submit', e => {
      e.preventDefault();
      const amount = Math.round(parseFloat($('amount').value) * 100) / 100;
      if (!(amount > 0) || !$('date').value) return;

      const tx = { id: newId(), date: $('date').value, type, amount, category: cat, description: $('description').value.trim() };
      txs.unshift(tx);
      queue.push({ action: 'add', tx });
      persist();

      const [y, m] = tx.date.split('-').map(Number);
      view = { y, m: m - 1 };           // מציג את החודש שאליו נוספה התנועה
      render(); closeModal();
      $('amount').value = ''; $('description').value = ''; $('date').value = ymd(new Date());
      setSync('pending');
      flush().then(syncIdle);
    });

    $('transactionsList').addEventListener('click', e => {
      const b = e.target.closest('[data-del]');
      if (!b || !confirm('למחוק את התנועה?')) return;
      const id = b.dataset.del;
      txs = txs.filter(t => String(t.id) !== id);
      queue.push({ action: 'delete', id });
      persist(); render(); setSync('pending');
      flush().then(syncIdle);
    });

    window.addEventListener('online', fetchData);

    document.addEventListener('DOMContentLoaded', () => {
      $('date').value = ymd(new Date());   // תאריך מקומי, לא UTC
      setType('expense');
      render();
      syncIdle();
      fetchData();
    });
  </script>
</body>
</html>
