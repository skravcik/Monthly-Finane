<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>ניהול תזרים ותקציב משפחתי</title>
  
  <!-- App Icons & PWA Metadata -->
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <meta name="theme-color" content="#4f46e5" />

  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Lucide Icons -->
  <script src="https://unpkg.com/lucide@latest"></script>
  <!-- Chart.js -->
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

  <style>
    @import url('https://fonts.googleapis.com/css2?family=Rubik:wght@300;400;500;600;700&display=swap');
    body { font-family: 'Rubik', sans-serif; -webkit-tap-highlight-color: transparent; }
    /* Custom scrollbar for list */
    ::-webkit-scrollbar { width: 4px; }
    ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 4px; }
  </style>
</head>
<body class="bg-slate-50 text-slate-800 min-h-screen pb-12">

  <!-- Header -->
  <header class="bg-indigo-600 text-white shadow-md sticky top-0 z-50">
    <div class="max-w-md mx-auto px-4 py-3.5 flex items-center justify-between">
      <div class="flex items-center space-x-2 space-x-reverse">
        <div class="p-1.5 bg-indigo-500/50 rounded-xl">
          <i data-lucide="wallet" class="w-6 h-6 text-indigo-100"></i>
        </div>
        <div>
          <h1 class="text-lg font-bold leading-tight">תזרים משפחתי</h1>
          <p class="text-[11px] text-indigo-200 leading-none">מעקב הוצאות והכנסות</p>
        </div>
      </div>
      <div id="syncStatus" class="flex items-center gap-1.5 text-xs bg-indigo-500/60 text-indigo-100 px-2.5 py-1 rounded-full border border-indigo-400/30">
        <i data-lucide="refresh-cw" id="syncIcon" class="w-3.5 h-3.5"></i>
        <span id="syncText">מסונכרן</span>
      </div>
    </div>
  </header>

  <main class="max-w-md mx-auto px-4 pt-4 space-y-5">

    <!-- Month Selector -->
    <section class="bg-white rounded-2xl p-3 shadow-sm border border-slate-200 flex items-center justify-between">
      <button onclick="changeMonth(-1)" class="p-2 rounded-xl hover:bg-slate-100 text-slate-600 transition-colors">
        <i data-lucide="chevron-right" class="w-5 h-5"></i>
      </button>
      <div class="text-center">
        <span class="text-xs text-slate-400 font-medium block">תקופת דיווח</span>
        <span id="currentMonthLabel" class="text-base font-bold text-slate-800">אוקטובר 2026</span>
      </div>
      <button onclick="changeMonth(1)" class="p-2 rounded-xl hover:bg-slate-100 text-slate-600 transition-colors">
        <i data-lucide="chevron-left" class="w-5 h-5"></i>
      </button>
    </section>

    <!-- Summary Cards -->
    <section class="grid grid-cols-3 gap-2.5">
      <!-- Income -->
      <div class="bg-emerald-50 border border-emerald-200/80 rounded-2xl p-3 text-center shadow-sm">
        <div class="inline-flex p-1.5 bg-emerald-100 text-emerald-600 rounded-xl mb-1">
          <i data-lucide="arrow-down-left" class="w-4 h-4"></i>
        </div>
        <p class="text-[11px] text-emerald-700 font-medium">הכנסות</p>
        <p id="totalIncome" class="text-sm sm:text-base font-bold text-emerald-800 mt-0.5">₪0</p>
      </div>

      <!-- Expenses -->
      <div class="bg-rose-50 border border-rose-200/80 rounded-2xl p-3 text-center shadow-sm">
        <div class="inline-flex p-1.5 bg-rose-100 text-rose-600 rounded-xl mb-1">
          <i data-lucide="arrow-up-right" class="w-4 h-4"></i>
        </div>
        <p class="text-[11px] text-rose-700 font-medium">הוצאות</p>
        <p id="totalExpenses" class="text-sm sm:text-base font-bold text-rose-800 mt-0.5">₪0</p>
      </div>

      <!-- Net Savings -->
      <div class="bg-indigo-50 border border-indigo-200/80 rounded-2xl p-3 text-center shadow-sm">
        <div class="inline-flex p-1.5 bg-indigo-100 text-indigo-600 rounded-xl mb-1">
          <i data-lucide="piggy-bank" class="w-4 h-4"></i>
        </div>
        <p class="text-[11px] text-indigo-700 font-medium">חיסכון נטו</p>
        <p id="netBalance" class="text-sm sm:text-base font-bold text-indigo-800 mt-0.5">₪0</p>
      </div>
    </section>

    <!-- Expenses Chart Section -->
    <section id="chartSection" class="bg-white rounded-2xl p-4 shadow-sm border border-slate-200 hidden">
      <h3 class="text-xs font-bold text-slate-500 uppercase tracking-wider mb-3 flex items-center gap-1.5">
        <i data-lucide="pie-chart" class="w-4 h-4 text-indigo-600"></i>
        התפלגות הוצאות החודש
      </h3>
      <div class="relative h-48 w-full flex justify-center">
        <canvas id="expensesChart"></canvas>
      </div>
    </section>

    <!-- Quick Add Form -->
    <section class="bg-white rounded-2xl p-4 sm:p-5 shadow-sm border border-slate-200">
      <h2 class="text-sm font-bold text-slate-800 mb-3 flex items-center gap-2">
        <i data-lucide="plus-circle" class="w-5 h-5 text-indigo-600"></i>
        דיווח תנועה חדשה
      </h2>

      <form id="transactionForm" class="space-y-3.5">
        
        <!-- Type Switcher -->
        <div class="grid grid-cols-2 gap-1.5 p-1 bg-slate-100 rounded-xl">
          <button type="button" id="btnExpense" onclick="setType('expense')" 
            class="py-2 rounded-lg text-xs font-bold transition-all shadow-sm bg-rose-600 text-white flex items-center justify-center gap-1.5">
            <i data-lucide="minus-circle" class="w-4 h-4"></i>
            הוצאה
          </button>
          <button type="button" id="btnIncome" onclick="setType('income')" 
            class="py-2 rounded-lg text-xs font-bold transition-all text-slate-600 hover:text-slate-800 flex items-center justify-center gap-1.5">
            <i data-lucide="plus-circle" class="w-4 h-4"></i>
            הכנסה
          </button>
        </div>

        <!-- Amount & Date -->
        <div class="grid grid-cols-2 gap-2.5">
          <div>
            <label class="block text-[11px] font-medium text-slate-600 mb-1">סכום (₪)</label>
            <input type="number" id="amount" step="0.01" required placeholder="0.00"
              class="w-full text-base font-bold px-3 py-2 border border-slate-300 rounded-xl focus:ring-2 focus:ring-indigo-500 focus:outline-none" />
          </div>
          <div>
            <label class="block text-[11px] font-medium text-slate-600 mb-1">תאריך</label>
            <input type="date" id="date" required
              class="w-full px-3 py-2 border border-slate-300 rounded-xl text-xs sm:text-sm focus:ring-2 focus:ring-indigo-500 focus:outline-none" />
          </div>
        </div>

        <!-- Category Grid -->
        <div>
          <label class="block text-[11px] font-medium text-slate-600 mb-1.5">בחירת קטגוריה</label>
          <div id="categoryGrid" class="grid grid-cols-4 gap-1.5">
            <!-- Dynamic Category Buttons -->
          </div>
        </div>

        <!-- Description -->
        <div>
          <label class="block text-[11px] font-medium text-slate-600 mb-1">תיאור / הערה (אופציונלי)</label>
          <input type="text" id="description" placeholder="למשל: סופרמרקט, דלק..."
            class="w-full px-3 py-2 border border-slate-300 rounded-xl text-xs sm:text-sm focus:ring-2 focus:ring-indigo-500 focus:outline-none" />
        </div>

        <!-- Submit Button -->
        <button type="submit" id="submitBtn"
          class="w-full bg-indigo-600 hover:bg-indigo-700 active:scale-[0.99] text-white font-bold py-3 rounded-xl shadow-md transition-all flex items-center justify-center gap-2 text-sm">
          <i data-lucide="send" class="w-4 h-4"></i>
          שמור דיווח בענן
        </button>
      </form>
    </section>

    <!-- Recent Transactions List -->
    <section class="bg-white rounded-2xl p-4 sm:p-5 shadow-sm border border-slate-200">
      <div class="flex items-center justify-between mb-3">
        <h2 class="text-sm font-bold text-slate-800 flex items-center gap-2">
          <i data-lucide="list-filter" class="w-4 h-4 text-indigo-600"></i>
          פירוט תנועות החודש
        </h2>
        <span id="txCount" class="text-xs text-slate-400 font-medium">0 תנועות</span>
      </div>

      <div id="transactionsList" class="space-y-2 max-h-80 overflow-y-auto pr-1">
        <p class="text-center text-slate-400 text-xs py-6">טוען נתונים...</p>
      </div>
    </section>

  </main>

  <script>
    // --- Google Apps Script Web App URL ---
    // **הדבק כאן את הקישור שקיבלת לאחר פרסום הסקריפט בגוגל דרייב**
    const GOOGLE_SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbwXcmhXbMfDIlex82LYxn_CQKjIIxKJ1n16TaVZI33EByzXjZYm8AOYBZCyYtmsfPVN/exec';

    // Categories Configuration
    const categories = [
      { id: 'supermarket', name: 'סופרמרקט', icon: 'shopping-cart', color: '#10b981' },
      { id: 'housing', name: 'דיור וחשבונות', icon: 'home', color: '#3b82f6' },
      { id: 'transport', name: 'רכב ותחבורה', icon: 'car', color: '#f59e0b' },
      { id: 'eating_out', name: 'מסעדות ובילוי', icon: 'utensils', color: '#f97316' },
      { id: 'health', name: 'בריאות ופארם', icon: 'heart-pulse', color: '#f43f5e' },
      { id: 'kids', name: 'ילדים וחינוך', icon: 'baby', color: '#a855f7' },
      { id: 'shopping', name: 'קניות וביגוד', icon: 'shopping-bag', color: '#ec4899' },
      { id: 'salary', name: 'משכורת/הכנסה', icon: 'banknote', color: '#14b8a6' },
      { id: 'other', name: 'שונות', icon: 'more-horizontal', color: '#64748b' }
    ];

    let currentType = 'expense';
    let selectedCategory = 'supermarket';
    let transactions = [];
    let currentDate = new Date(); // Current viewing month
    let chartInstance = null;

    // Hebrew Month Names
    const monthNames = [
      "ינואר", "פברואר", "מרץ", "אפריל", "מאי", "יוני",
      "יולי", "אוגוסט", "ספטמבר", "אוקטובר", "נובמבר", "דצמבר"
    ];

    // Initialize Page
    document.addEventListener('DOMContentLoaded', () => {
      document.getElementById('date').valueAsDate = new Date();
      renderCategories();
      updateMonthDisplay();
      
      // Load cached data first for instant launch
      const cachedData = localStorage.getItem('family_budget_txs');
      if (cachedData) {
        transactions = JSON.parse(cachedData);
        updateUI();
      }

      lucide.createIcons();
      fetchData();
    });

    function updateMonthDisplay() {
      const monthStr = monthNames[currentDate.getMonth()];
      const yearStr = currentDate.getFullYear();
      document.getElementById('currentMonthLabel').innerText = `${monthStr} ${yearStr}`;
    }

    function changeMonth(delta) {
      currentDate.setMonth(currentDate.getMonth() + delta);
      updateMonthDisplay();
      updateUI();
    }

    function setType(type) {
      currentType = type;
      const btnExpense = document.getElementById('btnExpense');
      const btnIncome = document.getElementById('btnIncome');

      if (type === 'expense') {
        btnExpense.className = 'py-2 rounded-lg text-xs font-bold transition-all shadow-sm bg-rose-600 text-white flex items-center justify-center gap-1.5';
        btnIncome.className = 'py-2 rounded-lg text-xs font-bold transition-all text-slate-600 hover:text-slate-800 flex items-center justify-center gap-1.5';
        if (selectedCategory === 'salary') selectCategory('supermarket');
      } else {
        btnIncome.className = 'py-2 rounded-lg text-xs font-bold transition-all shadow-sm bg-emerald-600 text-white flex items-center justify-center gap-1.5';
        btnExpense.className = 'py-2 rounded-lg text-xs font-bold transition-all text-slate-600 hover:text-slate-800 flex items-center justify-center gap-1.5';
        selectCategory('salary');
      }
    }

    function renderCategories() {
      const grid = document.getElementById('categoryGrid');
      grid.innerHTML = categories.map(cat => {
        const isSelected = cat.id === selectedCategory;
        return `
          <button type="button" onclick="selectCategory('${cat.id}')"
            class="p-2 rounded-xl border flex flex-col items-center text-center transition-all ${
              isSelected 
                ? 'border-indigo-600 bg-indigo-50 text-indigo-700 shadow-sm font-bold' 
                : 'border-slate-200 bg-slate-50/60 text-slate-600 hover:bg-slate-100'
            }">
            <i data-lucide="${cat.icon}" class="w-4 h-4 mb-1"></i>
            <span class="text-[10px] leading-tight">${cat.name}</span>
          </button>
        `;
      }).join('');
      lucide.createIcons();
    }

    function selectCategory(id) {
      selectedCategory = id;
      renderCategories();
    }

    // Form Submit Handler
    document.getElementById('transactionForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const submitBtn = document.getElementById('submitBtn');
      submitBtn.disabled = true;
      submitBtn.innerHTML = '<i data-lucide="refresh-cw" class="w-4 h-4 animate-spin"></i> שומר...';
      lucide.createIcons();

      const newTx = {
        id: Date.now(),
        date: document.getElementById('date').value,
        type: currentType,
        amount: parseFloat(document.getElementById('amount').value),
        category: selectedCategory,
        description: document.getElementById('description').value || ''
      };

      // Unshift to local list & Cache
      transactions.unshift(newTx);
      localStorage.setItem('family_budget_txs', JSON.stringify(transactions));
      updateUI();

      // Cloud Sync
      if (GOOGLE_SCRIPT_URL && GOOGLE_SCRIPT_URL !== 'YOUR_GOOGLE_APPS_SCRIPT_WEB_APP_URL_HERE') {
        try {
          await fetch(GOOGLE_SCRIPT_URL, {
            method: 'POST',
            mode: 'no-cors',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(newTx)
          });
        } catch (err) {
          console.error('Save error:', err);
        }
      }

      // Reset Form Inputs
      document.getElementById('amount').value = '';
      document.getElementById('description').value = '';
      submitBtn.disabled = false;
      submitBtn.innerHTML = '<i data-lucide="send" class="w-4 h-4"></i> שמור דיווח בענן';
      lucide.createIcons();
    });

    async function fetchData() {
      if (!GOOGLE_SCRIPT_URL || GOOGLE_SCRIPT_URL === 'YOUR_GOOGLE_APPS_SCRIPT_WEB_APP_URL_HERE') {
        return;
      }

      const syncIcon = document.getElementById('syncIcon');
      const syncText = document.getElementById('syncText');
      syncIcon.classList.add('animate-spin');
      syncText.innerText = 'מסתנכרן...';

      try {
        const res = await fetch(GOOGLE_SCRIPT_URL);
        const data = await res.json();
        transactions = data;
        localStorage.setItem('family_budget_txs', JSON.stringify(transactions));
        updateUI();
        syncText.innerText = 'מסונכרן';
      } catch (e) {
        console.error('Fetch error:', e);
        syncText.innerText = 'שגיאת סנכרון';
      } finally {
        syncIcon.classList.remove('animate-spin');
      }
    }

    function updateUI() {
      const selectedYear = currentDate.getFullYear();
      const selectedMonth = currentDate.getMonth();

      // Filter transactions for selected month
      const filtered = transactions.filter(tx => {
        if (!tx.date) return false;
        const parts = tx.date.split('-');
        if (parts.length < 2) return false;
        const txYear = parseInt(parts[0]);
        const txMonth = parseInt(parts[1]) - 1; // 0-indexed
        return txYear === selectedYear && txMonth === selectedMonth;
      });

      let incomeSum = 0;
      let expenseSum = 0;
      const categoryTotals = {};

      filtered.forEach(tx => {
        if (tx.type === 'income') {
          incomeSum += tx.amount;
        } else {
          expenseSum += tx.amount;
          categoryTotals[tx.category] = (categoryTotals[tx.category] || 0) + tx.amount;
        }
      });

      const net = incomeSum - expenseSum;

      document.getElementById('totalIncome').innerText = `₪${incomeSum.toLocaleString()}`;
      document.getElementById('totalExpenses').innerText = `₪${expenseSum.toLocaleString()}`;
      document.getElementById('netBalance').innerText = `₪${net.toLocaleString()}`;

      // Update Chart
      renderChart(categoryTotals);

      // Render Transaction Items
      const listContainer = document.getElementById('transactionsList');
      document.getElementById('txCount').innerText = `${filtered.length} תנועות`;

      if (filtered.length === 0) {
        listContainer.innerHTML = '<p class="text-center text-slate-400 text-xs py-6">אין תנועות רשומות בחודש זה</p>';
        return;
      }

      listContainer.innerHTML = filtered.map(tx => {
        const catObj = categories.find(c => c.id === tx.category) || categories[categories.length - 1];
        const isIncome = tx.type === 'income';

        return `
          <div class="flex items-center justify-between p-2.5 rounded-xl border border-slate-100 bg-slate-50/50 hover:bg-slate-100/50 transition-colors">
            <div class="flex items-center gap-2.5">
              <div class="p-2 rounded-xl ${isIncome ? 'bg-emerald-100 text-emerald-700' : 'bg-rose-100 text-rose-700'}">
                <i data-lucide="${catObj.icon}" class="w-4 h-4"></i>
              </div>
              <div>
                <p class="text-xs sm:text-sm font-bold text-slate-800">${catObj.name}</p>
                <p class="text-[11px] text-slate-400">${tx.date} ${tx.description ? '• ' + tx.description : ''}</p>
              </div>
            </div>
            <span class="text-xs sm:text-sm font-bold ${isIncome ? 'text-emerald-600' : 'text-rose-600'}">
              ${isIncome ? '+' : '-'}₪${tx.amount.toLocaleString()}
            </span>
          </div>
        `;
      }).join('');

      lucide.createIcons();
    }

    function renderChart(categoryTotals) {
      const chartSection = document.getElementById('chartSection');
      const keys = Object.keys(categoryTotals);

      if (keys.length === 0) {
        chartSection.classList.add('hidden');
        return;
      }

      chartSection.classList.remove('hidden');

      const labels = [];
      const dataValues = [];
      const backgroundColors = [];

      keys.forEach(key => {
        const cat = categories.find(c => c.id === key) || categories[categories.length - 1];
        labels.push(cat.name);
        dataValues.push(categoryTotals[key]);
        backgroundColors.push(cat.color);
      });

      const ctx = document.getElementById('expensesChart').getContext('2d');

      if (chartInstance) {
        chartInstance.destroy();
      }

      chartInstance = new Chart(ctx, {
        type: 'doughnut',
        data: {
          labels: labels,
          datasets: [{
            data: dataValues,
            backgroundColor: backgroundColors,
            borderWidth: 2,
            borderColor: '#ffffff'
          }]
        },
        options: {
          responsive: true,
          maintainAspectRatio: false,
          plugins: {
            legend: {
              position: 'right',
              labels: {
                font: { family: 'Rubik', size: 11 },
                boxWidth: 12
              }
            }
          },
          cutout: '65%'
        }
      });
    }
  </script>
</body>
</html>
